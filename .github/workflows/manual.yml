name: Manual Build
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project"
        required: true
        type: choice
        options: [openwrt, immortalwrt, immortalwrt-mt798x, immortalwrt-mt798x-6.6]
      version_type:
        description: "Version type"
        required: true
        type: choice
        options: [snapshot, stable]
      tag:
        description: "Tag / branch (stable only; leave empty to fetch latest stable)"
        required: false
        type: string
      config_path:
        description: "Config file path"
        required: false
        type: string
        default: config/x86_64_config
      custom_feeds:
        description: "Extra feeds: src-git name url;src-git name2 url2"
        required: false
        type: string
        default: ""
      threads:
        description: "Build threads (0 = auto)"
        required: false
        type: string
        default: "0"
      hostname:
        description: "Custom hostname"
        required: false
        type: string
        default: ""
      ip_addr:
        description: "Custom LAN IP address"
        required: false
        type: string
        default: ""
      root_password:
        description: "Root password"
        required: false
        type: string
        default: ""
      shell:
        description: "Default shell"
        required: false
        type: choice
        options: [ash, bash]
        default: ash
      enable_argon:
        description: "Include argon theme"
        required: false
        type: boolean
        default: false
      enable_bbr:
        description: "Enable BBR congestion control"
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: "Force rebuild (clean cache)"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish draft release"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PROJECTS: >-
    {
      "openwrt":               {"clone_url":"https://git.openwrt.org/openwrt/openwrt.git",              "release_src":"openwrt_downloads"},
      "immortalwrt":           {"clone_url":"https://github.com/immortalwrt/immortalwrt.git",           "release_src":"immortalwrt/immortalwrt"},
      "immortalwrt-mt798x":    {"clone_url":"https://github.com/hanwckf/immortalwrt-mt798x.git",        "release_src":"hanwckf/immortalwrt-mt798x"},
      "immortalwrt-mt798x-6.6":{"clone_url":"https://github.com/padavanonly/immortalwrt-mt798x-6.6.git","release_src":"padavanonly/immortalwrt-mt798x-6.6"}
    }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/{ghc,az,microsoft}
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl gzip tar zip xz-utils bzip2 zstd \
            make cmake autoconf automake libtool patch diffutils findutils grep sed \
            help2man texinfo libelf-dev libfuse-dev liblzma-dev libxml2-dev \
            libyaml-dev uuid-dev device-tree-compiler antlr3 gperf time bc jq \
            xxd swig upx-ucl ccache ecj fastjar imagemagick llvm libbpf-dev u-boot-tools

      - name: Resolve project metadata
        id: meta
        run: |
          CLONE_URL=$(echo '${{ env.PROJECTS }}' \
            | jq -r '."${{ inputs.project }}".clone_url')
          RELEASE_SRC=$(echo '${{ env.PROJECTS }}' \
            | jq -r '."${{ inputs.project }}".release_src')
          echo "clone_url=$CLONE_URL" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.version_type }}" = "stable" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
            elif [ "$RELEASE_SRC" = "openwrt_downloads" ]; then
              VER=$(curl -fsL "https://downloads.openwrt.org/.versions.json" \
                    | jq -r '.stable_version')
              TAG="v${VER}"
            else
              TAG=$(curl -fsL \
                "https://api.github.com/repos/${RELEASE_SRC}/releases/latest" \
                | jq -r '.tag_name')
            fi
          else
            TAG="snapshot"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone & checkout
        run: |
          if [ "${{ inputs.version_type }}" = "snapshot" ]; then
            git clone --depth 1 "${{ steps.meta.outputs.clone_url }}" wrt
          else
            git clone "${{ steps.meta.outputs.clone_url }}" wrt
            cd wrt && git fetch --tags
            git checkout "${{ steps.meta.outputs.tag }}" \
              || { echo "Tag '${{ steps.meta.outputs.tag }}' not found"; exit 1; }
          fi
          echo "$(git -C wrt describe --tags --always)"

      - name: Clone argon theme
        if: inputs.enable_argon == true
        working-directory: wrt
        run: |
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

      - name: Apply custom configs
        working-directory: wrt
        run: |
          CFG=package/base-files/files/bin/config_generate
          SHADOW=package/base-files/files/etc/shadow
          PASSWD=package/base-files/files/etc/passwd
          [ -n "${{ inputs.hostname }}" ] && [ -f "$CFG" ] && \
            sed -i -E "s/(OpenWrt|ImmortalWrt)/${{ inputs.hostname }}/g" "$CFG"
          [ -n "${{ inputs.ip_addr }}" ] && [ -f "$CFG" ] && \
            sed -i -E "s/192\.168\.[0-9]+\.[0-9]+/${{ inputs.ip_addr }}/g" "$CFG"
          if [ -n "${{ inputs.root_password }}" ] && [ -f "$SHADOW" ]; then
            HASH=$(openssl passwd -6 '${{ inputs.root_password }}')
            sed -i "s|^root:[^:]*:|root:${HASH}:|" "$SHADOW"
          fi
          [ -f "$PASSWD" ] && \
            sed -i "s|/bin/ash|/bin/${{ inputs.shell }}|g" "$PASSWD"

      - name: Apply system tweaks
        working-directory: wrt
        run: |
          if [ "${{ inputs.enable_argon }}" = "true" ]; then
            mkdir -p package/base-files/files/etc/uci-defaults
            cat > package/base-files/files/etc/uci-defaults/99-set-theme << 'EOF'
          uci set luci.main.mediaurlbase=/luci-static/argon
          uci commit luci
          EOF
            chmod +x package/base-files/files/etc/uci-defaults/99-set-theme
          fi

          if [ "${{ inputs.enable_bbr }}" = "true" ]; then
            mkdir -p package/base-files/files/etc/sysctl.d
            cat > package/base-files/files/etc/sysctl.d/99-bbr.conf << 'EOF'
          net.core.default_qdisc=fq_codel
          net.ipv4.tcp_congestion_control=bbr
          EOF
          fi

      - name: Feeds & config
        working-directory: wrt
        run: |
          [ -n "${{ inputs.custom_feeds }}" ] && \
            echo "${{ inputs.custom_feeds }}" | tr ';' '\n' >> feeds.conf.default
          ./scripts/feeds update -a && ./scripts/feeds install -a
          CONFIG="${{ inputs.config_path || 'config/x86_64_config' }}"
          [ -f "../$CONFIG" ] && cp "../$CONFIG" .config
          make defconfig

      # mixkey = project + tag, uniquely identifies cache per project/version.
      # clean = true when force_rebuild is checked, purges old cache entries.
      - name: Cache toolchain & ccache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache:    'true'
          toolchain: 'true'
          skip:      'true'
          clean:     '${{ inputs.force_rebuild }}'
          prefix:    '${{ github.workspace }}/wrt'
          mixkey:    '${{ inputs.project }}-${{ steps.meta.outputs.tag }}'

      - name: Cache downloads
        uses: actions/cache@v4
        if: inputs.force_rebuild == false
        with:
          path: wrt/dl
          key: ${{ runner.os }}-dl-${{ inputs.project }}-${{ steps.meta.outputs.tag }}
          restore-keys: ${{ runner.os }}-dl-${{ inputs.project }}-

      - name: Download packages
        working-directory: wrt
        run: time make download -j1 --ignore-errors

      - name: Compile
        working-directory: wrt
        run: |
          JOBS=$([ "${{ inputs.threads }}" = "0" ] && nproc || echo "${{ inputs.threads }}")
          time make world -j"$JOBS" 2>&1 | tee world.log \
            || { time make world -j1 V=s 2>&1 | tee -a world.log; exit 1; }

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.project }}-${{ steps.meta.outputs.tag }}-${{ github.run_number }}
          path: wrt/bin/targets/**
          retention-days: 30

      - name: Upload .config
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.project }}-config-${{ github.run_number }}
          path: wrt/.config
          retention-days: 7

      - name: Upload build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ inputs.project }}-log-${{ github.run_number }}
          path: wrt/world.log
          retention-days: 7

      - name: Draft release
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wrt/bin/targets/**
            !wrt/bin/targets/**/packages/**
          tag_name: ${{ inputs.project }}-${{ steps.meta.outputs.tag }}
          name: "${{ inputs.project }} ${{ steps.meta.outputs.tag }}"
          draft: true
