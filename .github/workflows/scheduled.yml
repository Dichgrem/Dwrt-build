name: Scheduled Build
# Automatically checks downloads.openwrt.org for a new stable release.
# If a new version is found (compared to our last published release),
# it clones, builds, and drafts a GitHub release.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENWRT_URL: https://git.openwrt.org/openwrt/openwrt.git
  CONFIG_PATH: config/x86_64_config
  EXTRA_FEEDS: |
    src-git luci-app-zzz https://github.com/Dichgrem/luci-app-zzz.git
    src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git

jobs:
  # ── 1. Check whether a new stable release exists ──────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      tag:        ${{ steps.check.outputs.tag }}
    steps:
      - name: Compare upstream stable vs last built
        id: check
        run: |
          # Official source of truth: downloads.openwrt.org/.versions.json
          VER=$(curl -fsL "https://downloads.openwrt.org/.versions.json" \
                | jq -r '.stable_version')
          LATEST="v${VER}"

          # What did we last build? Look for releases tagged "openwrt-vX.Y.Z"
          CURRENT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            | awk '/^openwrt-v[0-9]/{print $1; exit}' \
            | sed 's/^openwrt-//' || true)

          echo "Current: ${CURRENT:-none}   Latest upstream: $LATEST"
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "has_update=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST"      >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build & release ────────────────────────────────────────────────────
  build:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/{ghc,az,microsoft}
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl gzip tar zip xz-utils bzip2 zstd \
            make cmake autoconf automake libtool patch diffutils findutils grep sed \
            help2man texinfo libelf-dev libfuse-dev liblzma-dev libxml2-dev \
            libyaml-dev uuid-dev device-tree-compiler antlr3 gperf time bc jq \
            xxd swig upx-ucl ccache ecj fastjar imagemagick llvm libbpf-dev u-boot-tools

      - name: Clone & checkout ${{ needs.check.outputs.tag }}
        run: |
          git clone "$OPENWRT_URL" wrt
          cd wrt && git fetch --tags && git checkout "${{ needs.check.outputs.tag }}"
          echo "📌 $(git describe --tags --always)"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-openwrt-${{ needs.check.outputs.tag }}
          max-size: 2G

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: wrt/dl
          key: ${{ runner.os }}-dl-openwrt-${{ needs.check.outputs.tag }}
          restore-keys: ${{ runner.os }}-dl-openwrt-

      - name: Apply feeds, config & build
        working-directory: wrt
        run: |
          printf "%s\n" "$EXTRA_FEEDS" >> feeds.conf.default
          ./scripts/feeds update -a && ./scripts/feeds install -a
          [ -f "../$CONFIG_PATH" ] && cp "../$CONFIG_PATH" .config
          make defconfig
          time make download -j1 --ignore-errors
          time make world -j$(nproc) 2>&1 | tee world.log \
            || { time make world -j1 V=s 2>&1 | tee -a world.log; exit 1; }

      - name: Upload build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openwrt-log-${{ needs.check.outputs.tag }}
          path: wrt/world.log
          retention-days: 7

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wrt/bin/targets/**
          tag_name: openwrt-${{ needs.check.outputs.tag }}
          name: "OpenWrt ${{ needs.check.outputs.tag }}"
          draft: true
